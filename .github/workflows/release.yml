name: Release

# 打 tag 就出包：
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# 为什么单独一个工作流、不挂在 ci.yml 上：触发条件不一样（那边是 push 到 main 与 PR），
# 做的事也不一样 —— 那边是**检查**，这里是**出货**。混在一起会让每个 PR 的检查里
# 都多出一堆用不上的安卓打包步骤与写权限。
on:
  push:
    tags:
      - 'v*'

# gh release create 要写权限。**给在作业一级，不给整个工作流**。
permissions:
  contents: write

jobs:
  release:
    name: 编 release APK 并发 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 版本从 go.mod 读，不在这儿再写一遍（与 ci.yml 同一个理由）。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # wails3 这个 CLI 自己依赖 gtk4 / webkitgtk-6.0 的开发包 —— 即使这一趟只跑安卓的
      # 任务，也得先把 CLI 编出来。缺了它 `go install` 会以
      # "Package gtk4 was not found in the pkg-config search path" 失败。
      - name: 装 wails3 CLI 在 Linux 上要的那两个开发包
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 与 ci.yml 的 android 作业同一段：镜像里有 Android SDK，但 cmdline-tools 那个 bin
      # 不在 PATH 上，得按目录找（目录名是版本号，各镜像不一样）。
      - name: 装 NDK 与 platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bin=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)
          if [ -z "$bin" ]; then
            echo "找不到 cmdline-tools，$SDK 下有什么："
            ls "$SDK" || true
            exit 1
          fi
          export PATH="$bin:$PATH"
          sdkmanager --version
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22

      # ── 签名 ──
      #
      # 这把包**必须**用固定的钥匙签，理由在「分发平台是 GitHub」之后变得很硬：
      # 更新方式就是覆盖安装，而 Android 只允许同一把钥匙签的包覆盖安装。用 debug
      # keystore 发出去的包（AGP 在缺失时自建，每台机器/每次镜像更新都可能不同一把）
      # 以后换正式钥匙就再也覆盖不上 —— 只能卸载，而卸载 = 清空错题库：
      # 库与图片都在应用私有目录，而导出包是**单向**的（internal/export 只有出、
      # 没有导入的路），救不回来。
      #
      # 所以这里把钥匙从 secrets 落到 runner 的磁盘上，再交给 build.gradle
      # （它读的就是 ANDROID_KEYSTORE_FILE 这几个环境变量，不用改它）。
      #
      # 钥匙本体与口令的备份**不在这个仓库里**，在作者的密码管理器/本地目录里。
      # 丢了就等于这道题永远做不出新版本 —— 别再生成一把了事。
      - name: 准备签名用的 keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::仓库里没有 ANDROID_KEYSTORE_BASE64。用 debug keystore 发出去的包，"
            echo "以后无法被正式钥匙签的包覆盖安装（卸载重装 = 清空错题库，而导出包没有导入的路），"
            echo "所以这里直接失败、不发。见本步上方的注释。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/questionbook-release.p12"
          ls -l "$RUNNER_TEMP/questionbook-release.p12"

      # package = build(PRODUCTION=true) + assemble:apk:release。
      # 与 ci.yml 那条 debug 路线的唯一区别就是这个 PRODUCTION：它带来
      # -tags production -trimpath -ldflags="-w -s"（去掉调试符号，体积更小）。
      #
      # 默认只出 arm64。要连 x86_64（模拟器）一起出，把下面换成 android:package:fat。
      - name: 编 release 变体（PRODUCTION=true，arm64）
        env:
          # 这四个变量是 build.gradle 直接读的（System.getenv）。**环境变量这条通道是通的**
          # —— 别被上面那段版本名的注释误导，那说的是 Gradle 的 ORG_GRADLE_PROJECT_ 前缀。
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/questionbook-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 版本名跟着 tag 走：v0.2.0 → "0.2.0"。versionCode 刻意不动，理由写在
          # build.gradle 的 defaultConfig 里（抬它会让 Release 之后装不回 debug 包）。
          #
          # 走 GRADLE_ARGS 这个任务变量，不是 ORG_GRADLE_PROJECT_versionName ——
          # Gradle 那个前缀到不了 gradle（实测 9.7.1），详见 build/android/Taskfile.yml
          # 里 assemble:apk:release 的那段注释。别记成「环境变量传不进去」：环境变量是通的。
          VERSION="${GITHUB_REF_NAME#v}"
          wails3 task android:package ARCH=arm64 GRADLE_ARGS="-PversionName=${VERSION}"

      # 两道：先把产物与元数据打进日志（出问题不用下 APK 去反解），再**断言**版本名真的
      # 注进去了。
      #
      # 这条断言不是形式主义：版本名漏注时构建照样成功、APK 照样能装，只有装上之后
      # 看一眼「应用信息」才会发现它写着 1.0 —— 而那时 Release 已经发出去了。
      # 加它是因为本地串这条路径时就**静默失败过一次**（版本名没注进去，唯一的迹象
      # 就是元数据里那个 1.0），而那次 Release 已经发出去了才发现。
      - name: 核对产出（版本名必须等于 tag）
        run: |
          test -f bin/questionbook.apk
          ls -l bin/questionbook.apk

          META=build/android/app/build/outputs/apk/release/output-metadata.json
          cat "$META"

          VERSION="${GITHUB_REF_NAME#v}"
          GOT=$(grep -o '"versionName": "[^"]*"' "$META" | cut -d'"' -f4)
          if [ "$GOT" != "$VERSION" ]; then
            echo "APK 里的 versionName 是「$GOT」，tag 是「$VERSION」—— 没注进去，别发这个包。"
            exit 1
          fi
          echo "版本名对上了：$GOT"

      # 与上面那条同一个道理，但更重：签名错了的包**发出去就收不回来** —— 装过它的人
      # （首先就是作者自己的手机）以后再也装不上正式钥匙签的版本，除非卸载 = 清库。
      #
      # 指纹不是秘密，它就印在 APK 里，谁都能读，所以写在这儿而不是放进 secrets。
      # 这个值是本地那把钥匙库的 SHA-256（`keytool -list -v` 读的），换钥匙时这里要跟着改。
      - name: 核对签名（必须是正式钥匙，不是 debug）
        run: |
          EXPECTED="C4:5F:FD:F5:2E:80:9E:DE:BB:68:69:8A:32:D3:BA:F1:F8:F3:ED:5D:41:1F:5C:CA:33:99:2F:D8:E6:5C:92:6B"
          GOT=$(keytool -printcert -jarfile bin/questionbook.apk \
                  | grep -m1 'SHA256:' \
                  | sed -E 's/.*SHA256:[[:space:]]*//' \
                  | tr -d '[:space:]')
          echo "APK 的签名证书 SHA-256：$GOT"
          echo "期望的：            $EXPECTED"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::这个包不是正式钥匙签的 —— 发出去之后永远没法覆盖安装，不发。"
            exit 1
          fi
          echo "签名对上了。"

      # 下载下来的文件名自带版本与架构，而不是一个没有上下文的 questionbook.apk。
      - name: 改名
        run: cp bin/questionbook.apk "questionbook-${GITHUB_REF_NAME}-arm64.apk"

      # --generate-notes：按提交自动写 release notes（首次发版会把全部提交列上）。
      # 要发预览版就给 tag 带个短横线（v0.2.0-rc1）并加 --prerelease。
      - name: 建 Release 并附上 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "questionbook-${GITHUB_REF_NAME}-arm64.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
