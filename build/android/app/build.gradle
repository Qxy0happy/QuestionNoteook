plugins {
    id 'com.android.application'
}

// 版本名可以由构建方注入 —— CI 打 tag 发 Release 时用它（值取自 tag）。
// 本地构建没有它，退回默认的 "1.0"。
//
// 传进来的方式是 `-PversionName=x`（CI 经 Taskfile 的 GRADLE_ARGS 传）。
// **不是** ORG_GRADLE_PROJECT_versionName 那个环境变量 —— 实测（Gradle 9.7.1）那个
// 前缀到不了 gradle，而 `-P` 与 System.getenv 两条路都是通的。
def injectedVersionName = project.findProperty('versionName') ?: "1.0"

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // 与 namespace 刻意不同：namespace 保持 com.wails.app（R 类命名空间 + Java 包名），
        // 只改应用身份。这样不用搬 5 个 java 文件，Taskfile 的 am start 组件名照旧可用。
        applicationId "com.questionbook.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        // 显示用的版本名（见文件顶部 injectedVersionName）。
        //
        // **刻意不动 versionCode**：安装器拿它判断升降级，而本地 debug 包一直是 1。
        // 把它抬上去（比如取 CI 的 run number）会造成一个很不划算的后果 —— 「发过 Release
        // 之后再也装不回 debug 包」：adb install -r 会报 INSTALL_FAILED_VERSION_DOWNGRADE，
        // 而绕过它的唯一办法是先卸载，卸载等于清掉应用私有目录里的库和图片，不可恢复。
        // 所以版本号这件事只动显示，不动安装行为。
        versionName injectedVersionName

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // ── 签名 ──
    //
    // 钥匙就在仓库里：build/android/keystore/（明文）。自用 + 私有仓库，2026-09-17 用户定，
    // 理由与**为什么这把钥匙不能换**写在 keystore/keystore.properties 的顶部。
    //
    // 环境变量仍然优先 —— 想临时拿另一把钥匙编个包来试时不用改文件。
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file("keystore/keystore.properties")
    if (ksPropsFile.exists()) {
        ksPropsFile.withInputStream { ksProps.load(it) }
    }
    def ksFile = System.getenv("ANDROID_KEYSTORE_FILE") ?: ksProps.getProperty("storeFile")
    def ksAlias = System.getenv("ANDROID_KEY_ALIAS") ?: ksProps.getProperty("keyAlias")
    def ksStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ksProps.getProperty("storePassword")
    def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: ksProps.getProperty("keyPassword")

    signingConfigs {
        release {
            if (ksFile != null) {
                storeFile rootProject.file(ksFile)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 正式包**必须**用正式钥匙签。出厂脚手架这里是个兜底：
            // 「没给钥匙就退回 debug keystore，好歹能装」—— 现在钥匙就在仓库里，那个兜底
            // 只会把「钥匙不见了」这件事故悄悄变成「发了一个以后装不回来的包」。
            // 所以去掉了：钥匙不在，构建直接失败。
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
