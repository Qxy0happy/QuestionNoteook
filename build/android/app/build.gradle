plugins {
    id 'com.android.application'
}

// 版本名可以由构建方注入 —— CI 打 tag 发 Release 时用它（值取自 tag）。
// 本地构建没有它，退回默认的 "1.0"。
//
// 走**工程属性**而不是别的：CI 那边只要设 ORG_GRADLE_PROJECT_versionName 就能传进来，
// Taskfile 与 wails3 一行都不用改。
def injectedVersionName = project.findProperty('versionName') ?: "1.0"

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // 与 namespace 刻意不同：namespace 保持 com.wails.app（R 类命名空间 + Java 包名），
        // 只改应用身份。这样不用搬 5 个 java 文件，Taskfile 的 am start 组件名照旧可用。
        applicationId "com.questionbook.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        // 显示用的版本名（见文件顶部 injectedVersionName）。
        //
        // **刻意不动 versionCode**：安装器拿它判断升降级，而本地 debug 包一直是 1。
        // 把它抬上去（比如取 CI 的 run number）会造成一个很不划算的后果 —— 「发过 Release
        // 之后再也装不回 debug 包」：adb install -r 会报 INSTALL_FAILED_VERSION_DOWNGRADE，
        // 而绕过它的唯一办法是先卸载，卸载等于清掉应用私有目录里的库和图片，不可恢复。
        // 所以版本号这件事只动显示，不动安装行为。
        versionName injectedVersionName

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
