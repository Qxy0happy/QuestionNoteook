# 发版的签名钥匙。**明文放在仓库里是刻意的** —— 自用、私有仓库，2026-09-17 用户定。
#
# 但它比别人家的钥匙多一条硬约束：**这把钥匙不能换**。
# Android 只允许同一把钥匙签的包覆盖安装，而这个应用的更新方式就是覆盖安装。
# 换了钥匙（或丢了重生成一把），已经装出去的包就再也更新不上，只能卸载 ——
# 而卸载会清空整个错题库：库与图片都在应用私有目录，而导出包是**单向**的
# （internal/export 只有出、没有导入的路），救不回来。
#
# 所以：别重新生成，也别"顺手换一把更安全的"。要换就得接受一次清库。
#
# 指纹（SHA-256，工作流里那道签名断言比的就是它）：
#   C4:5F:FD:F5:2E:80:9E:DE:BB:68:69:8A:32:D3:BA:F1:F8:F3:ED:5D:41:1F:5C:CA:33:99:2F:D8:E6:5C:92:6B

